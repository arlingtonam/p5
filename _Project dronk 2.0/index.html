<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="../p5.min.js"></script>
    <meta charset="utf-8">
  </head>
  <body>
    <div id="toolbar">
      <button onclick="setMode('text')">text</button>
      <span class="divider">|</span>
      <!-- <input type="range" id="grid-size" min="5" max="100" value="20" step="1"/> -->
      <!-- <span id="cols-display">20</span> -->
      <button style="background: red" onclick="setColor('255,0,0')">red</button>
      <button style="background: green" onclick="setColor('0,255,0')">green</button>
      <button style="background: blue" onclick="setColor('0,0,255')">blue</button>
      <button style="background: yellow" onclick="setColor('255,255,0')">yellow</button>
      <button style="background: magenta" onclick="setColor('255,0,255')">magenta</button>
      <button style="background: cyan" onclick="setColor('0,255,255')">cyan</button>
      <button style="background: white" onclick="setColor('255,255,255')">white</button>
      <span class="divider">|</span>
      <button onclick="setPattern('polka')">polka</button>
      <button onclick="setPattern('linear')">gradient</button>
      <button onclick="setPattern('radial')">radial</button>
      <button onclick="setPattern('stripes')">stripes</button>
      <span class="divider">|</span>
      <button onclick="exportAsPNG()">PNG</button>
      <button onclick="exportAsHTML()">HTML</button>
      <button onclick="clearAll()">clear</button>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
